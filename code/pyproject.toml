[project]
name = "dify-frame-langgraph"
version = "0.1.0"
description = "Dify frame LangGraph version - AI Teller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 基础依赖
    "python-dotenv",

    # LangChain 生态
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-ollama",
    "langchain-community",
    "langgraph",

    # 向量数据库
    "chromadb",

    # HTTP 客户端
    "requests",

    # 交互式 Python
    "ipython",

    # 日志
    "loguru",

    # Web 框架
    "fastapi",
    "python-multipart",

    # Nacos服务注册
    "nacos-sdk-python>=0.1,<1",
]
