# NewHuman MVP — Conda 环境
# 创建: conda env create -f environment.yml
# 更新: conda env update -f environment.yml --prune
# 或运行: scripts/setup_conda.ps1

name: newhuman
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r code/requirements.txt
      - -r scripts/requirements-test.txt
