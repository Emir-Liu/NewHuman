[pytest]
testpaths = tests
pythonpath = code/app
markers =
    smoke: 无需 LLM 的基础检查（服务健康、目录结构）
    milestone_m1: M1 — ReAct + read_file + 流式 (TC-01, TC-02)
    milestone_m2: M2 — Workspace + Context (TC-05)
    milestone_m3: M3 — KB + exec + web (TC-03, TC-08~10)
    milestone_m4: M4 — Memory + stop (TC-06, TC-07)
    milestone_m5: M5 — 多轮对话等收尾 (TC-04)
    integration: 需要运行中的 API 与有效 LLM 配置
filterwarnings =
    ignore::DeprecationWarning
